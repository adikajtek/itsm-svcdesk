services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      KB_INDEX_URL: http://kb-index:8080
    volumes:
      - svcdesk-data:/data
    depends_on:
      - kb-index
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: adikajtek
    ports:
      - "8081:8080"

  tests:
    build: .
    profiles:
      - tests
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command:
      - python
      - -m
      - tests.run

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles:
      - observability
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  svcdesk-data:
