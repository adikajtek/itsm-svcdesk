# ai-generated: 100% - drafted with ChatGPT to test timing and threshold edges of the two Lab 3 burn-rate alerts

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Fast alert: 18% errors is above the real 14.4% threshold
  # but below the threshold-x1.5 mutant (21.6%).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+492x20'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+108x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: KbSearchAvailabilityBurnFast
        exp_alerts: []
      - eval_time: 6m
        alertname: KbSearchAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "Fast availability error-budget burn on /kb/search"

  # 11% errors is below the real 14.4% fast threshold,
  # but above the threshold/1.5 mutant threshold of 9.6%.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+534x20'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+66x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KbSearchAvailabilityBurnFast
        exp_alerts: []

  # Slow alert: 7.5% is above its real 6% threshold,
  # but below the threshold-x1.5 mutant threshold of 9%.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+555x20'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+45x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: KbSearchAvailabilityBurnSlow
        exp_alerts: []
      - eval_time: 6m
        alertname: KbSearchAvailabilityBurnSlow
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "Sustained availability error-budget burn on /kb/search"

  # 5% errors is below the real 6% slow threshold,
  # but above its threshold/1.5 mutant threshold of 4%.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+570x20'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+30x20'
